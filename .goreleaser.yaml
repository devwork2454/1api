# GoReleaser config for 1api — builds cross-platform binaries, cuts a GitHub
# release, and publishes a Homebrew cask to your tap.
# Docs: https://goreleaser.com
version: 2

# Directory is still named "charon"; force archive names to 1api_* for install.sh.
project_name: 1api

before:
  hooks:
    - go mod tidy
    # Generate shell completions from the CLI itself, bundled into each archive.
    - mkdir -p completions
    - sh -c 'go run ./cmd/1api completion bash > completions/1api.bash'
    - sh -c 'go run ./cmd/1api completion zsh  > completions/1api.zsh'
    - sh -c 'go run ./cmd/1api completion fish > completions/1api.fish'

builds:
  - id: 1api
    main: ./cmd/1api
    binary: 1api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: 1api
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

# Homebrew cask publish is intentionally omitted on this fork (no tap token).
# Install via curl from the GitHub release assets instead.

release:
  github:
    owner: devwork2454
    name: 1api
  # Attach the curl installer to each release so it can be fetched from the
  # release CDN (github.com/.../releases/latest/download/install.sh) instead of
  # raw.githubusercontent.com, which rate-limits (HTTP 429) by client IP.
  extra_files:
    - glob: ./scripts/install.sh
